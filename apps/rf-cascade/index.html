<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RF Cascade Analysis Tool</title>
  <!-- Reuse the main site CSS for base styles -->
  <link rel="stylesheet" href="../../css/style.css?v=4">
  <!-- App-specific styles -->
  <link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>
  
  <div class="app-layout">
    <!-- Top Bar -->
    <header class="app-header">
      <div class="app-header__title">RF Cascade Analysis</div>
      <div class="app-header__actions">
        <button id="btn-clear" class="app-btn">Clear Workspace</button>
        <button id="btn-close" class="app-btn app-btn--danger">Close App</button>
      </div>
    </header>

    <!-- Main Workspace Area -->
    <div class="app-main">
      <!-- Toolbox Sidebar -->
      <aside class="app-sidebar">
        <h3 class="sidebar-title">Components</h3>
        <p class="sidebar-subtitle">Drag & Drop into workspace</p>
        
        <div class="toolbox-items">
          <div class="toolbox-item" draggable="true" data-type="SignalSource">
            <span class="toolbox-item__icon" style="font-size:20px;">&#8767;</span>
            <span class="toolbox-item__text">Signal Source</span>
          </div>
          <div class="toolbox-item" draggable="true" data-type="FreeSpaceLink">
            <span class="toolbox-item__icon" style="font-size:12px;">FSL</span>
            <span class="toolbox-item__text">Free Space Link</span>
          </div>
          <div class="toolbox-item" draggable="true" data-type="Amplifier">
            <span class="toolbox-item__icon">&#9654;</span>
            <span class="toolbox-item__text">Amplifier</span>
          </div>
          <div class="toolbox-item" draggable="true" data-type="Attenuator">
            <span class="toolbox-item__icon" style="font-size:20px; font-weight:bold;">&approx;</span>
            <span class="toolbox-item__text">Attenuator</span>
          </div>
          <div class="toolbox-item" draggable="true" data-type="Filter">
            <span class="toolbox-item__icon">BPF</span>
            <span class="toolbox-item__text">Filter</span>
          </div>
          <div class="toolbox-item" draggable="true" data-type="Splitter">
            <span class="toolbox-item__icon" style="font-size:24px;">&#9094;</span>
            <span class="toolbox-item__text">Splitter</span>
          </div>
          <div class="toolbox-item" draggable="true" data-type="Combiner">
            <span class="toolbox-item__icon" style="font-size:24px;">&#8882;</span>
            <span class="toolbox-item__text">Combiner</span>
          </div>
          <div class="toolbox-item" draggable="true" data-type="Load">
            <span class="toolbox-item__icon" style="font-size:20px;">&#8486;</span>
            <span class="toolbox-item__text">Load</span>
          </div>
        </div>
      </aside>

      <!-- The Node Canvas -->
      <div id="workspace" class="workspace">
        <!-- SVG layer for wires -->
        <svg id="wires-layer" class="wires-layer"></svg>
        <!-- HTML Blocks will be dynamically appended here -->
      </div>

      <!-- Results Sidebar -->
      <aside class="app-sidebar">
        <h3 class="sidebar-title">Analysis</h3>
        <button id="btn-calculate" class="app-btn app-btn--primary" style="margin-bottom: var(--space-md);">Simulate</button>
        <p class="sidebar-subtitle">Results</p>
        <pre id="results-display" style="white-space: pre-wrap; font-family: var(--font-mono); font-size: var(--text-sm); background: var(--bg-primary); padding: var(--space-sm); border: 1px solid var(--border-color); border-radius: var(--radius-sm); min-height: 100px;"></pre>
      </aside>
    </div>
  </div>

  <!-- Context Menu (Hidden by default) -->
  <div id="context-menu" class="context-menu hidden">
    <div class="context-menu__item" id="menu-edit">Edit Parameters</div>
    <div class="context-menu__item context-menu__item--danger" id="menu-delete">Delete Block</div>
  </div>

  <!-- Parameter Edit Modal (Hidden by default) -->
  <div id="param-modal" class="modal hidden">
    <div class="modal__content">
      <h3 id="modal-title">Edit Block</h3>
      <div id="modal-body" class="modal__body">
        <!-- Dynamic inputs generated by JS -->
      </div>
      <div class="modal__footer">
        <button id="modal-cancel" class="app-btn">Cancel</button>
        <button id="modal-save" class="app-btn app-btn--primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/blocks.js?v=2"></script>
  <script src="js/workspace.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
