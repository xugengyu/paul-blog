<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Flight Map — Random Thoughts of a Random Guy</title>
  <meta name="description" content="Interactive map of FPV drone flight locations.">
  <link rel="stylesheet" href="css/style.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    #map {
      height: 600px;
      width: 100%;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      z-index: 1;
      /* Keep below nav */
    }
  </style>
</head>

<body>

  <!-- ====== Navigation ====== -->
  <nav class="nav" id="main-nav"></nav>

  <!-- ====== Main content ====== -->
  <main class="page-content">
    <div class="container" style="max-width:900px">
      <div class="fade-in">

        <h1 class="hero__name" style="margin-bottom: var(--space-md);">FPV Flight Map</h1>
        <p style="color: var(--text-secondary); margin-bottom: var(--space-2xl);">
          An interactive map showcasing the various locations I've flown my FPV drones around Washington State.
        </p>

        <div id="map"></div>

      </div>
    </div>
  </main>

  <footer class="footer">
    <p class="footer__text">&copy; 2026 Random Thoughts of a Random Guy. Built with care.</p>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="js/nav.js"></script>
  <script src="js/main.js"></script>

  <script>
    // Initialize map
    var map = L.map('map');

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Add Markers
    var markers = [
      L.marker([47.6974, -122.1484]).bindPopup("<b>60 Acre Park</b><br>Great wide open space for flying."),
      L.marker([47.6625, -122.1070]).bindPopup("<b>Marymoor RC Airfield</b><br>Dedicated AMA flying field in Redmond."),
      L.marker([47.6832, -121.9235]).bindPopup("<b>Snoqualmie Wildlife Area - Stillwater Unit</b><br>Scenic riverside area with open airspace, adjacent to the Snoqualmie Valley Trail."),
      L.marker([47.7560, -121.9860]).bindPopup("<b>Snoqualmie Wildlife Area - Cherry Valley Unit</b><br>Located north of Duvall, offering wide open floodplain flying areas."),
      L.marker([45.8819, -123.9594]).bindPopup("<b>Cannon Beach, Oregon</b><br>Beautiful coastal flying over the beach and sea stacks."),
      L.marker([47.8124, -122.0034]).bindPopup("<b>Crescent Lake Wildlife Area Unit</b><br>Oxbow lake south of Monroe with open fields and forest, part of the Snoqualmie Wildlife Area.")
    ];

    // Group markers and fit bounds automatically
    var group = L.featureGroup(markers).addTo(map);
    map.fitBounds(group.getBounds().pad(0.1));
  </script>
</body>

</html>
