<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Flight Map — Random Thoughts of a Random Guy</title>
  <meta name="description" content="Interactive map of FPV drone flight locations.">
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     
  <style>
    #map {
      height: 600px;
      width: 100%;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      z-index: 1; /* Keep below nav */
    }
  </style>
</head>
<body>

  <!-- ====== Navigation ====== -->
  <nav class="nav" id="main-nav"></nav>

  <!-- ====== Main content ====== -->
  <main class="page-content">
    <div class="container" style="max-width:900px">
      <div class="fade-in">
        
        <h1 class="hero__name" style="margin-bottom: var(--space-md);">FPV Flight Map</h1>
        <p style="color: var(--text-secondary); margin-bottom: var(--space-2xl);">
          An interactive map showcasing the various locations I've flown my FPV drones around Washington State.
        </p>
        
        <div id="map"></div>

      </div>
    </div>
  </main>

  <footer class="footer">
    <p class="footer__text">&copy; 2026 Random Thoughts of a Random Guy. Built with care.</p>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     
  <script src="js/nav.js"></script>
  <script src="js/main.js"></script>
  
  <script>
    // Initialize map centered on Redmond, WA area
    var map = L.map('map').setView([47.6800, -122.1277], 12);

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Add Markers
    var marker1 = L.marker([47.6974, -122.1484]).addTo(map);
    marker1.bindPopup("<b>60 Acre Park</b><br>Great wide open space for flying.");

    var marker2 = L.marker([47.6625, -122.1070]).addTo(map);
    marker2.bindPopup("<b>Marymoor RC Airfield</b><br>Dedicated AMA flying field in Redmond.");
  </script>
</body>
</html>
