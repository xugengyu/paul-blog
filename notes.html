<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes — Random Thoughts of a Random Guy</title>
  <meta name="description" content="An interactive mind map of engineering notes — click any node to explore.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ====== Navigation ====== -->
  <nav class="nav" id="main-nav"></nav>

  <!-- ====== Mind-map page (full viewport) ====== -->
  <div class="notes-page">
    <div class="mindmap-header">
      <div style="display: flex; gap: var(--space-md); align-items: center;">
        <h1 class="mindmap-header__title">Knowledge Graph</h1>
        <input type="text" id="note-search" class="form-input" placeholder="Search notes..." style="padding: var(--space-xs) var(--space-sm); font-size: var(--text-sm);">
      </div>
      <button id="legend-toggle" class="form-submit" style="padding: var(--space-xs) var(--space-sm);">Tags</button>
    </div>

    <div class="legend-panel" id="legend-panel">
      <div class="legend-panel__header">
        <h3 style="font-size: var(--text-sm); font-weight: 600; margin: 0; font-family: var(--font-sans); color: var(--text-primary);">Tags</h3>
        <button id="legend-close" class="note-overlay__close" style="position: static;">&times;</button>
      </div>
      <div class="mindmap-header__legend" id="mindmap-legend">
        <button class="legend-item legend-item--active" data-category="Fundamentals"><span class="legend-dot" style="background:var(--node-fundamentals)"></span> Fundamentals</button>
        <button class="legend-item legend-item--active" data-category="RF Engineering"><span class="legend-dot" style="background:var(--node-rf)"></span> RF Engineering</button>
        <button class="legend-item legend-item--active" data-category="Satellite Comms"><span class="legend-dot" style="background:var(--node-satcom)"></span> Satellite Comms</button>
        <button class="legend-item legend-item--active" data-category="Signal Processing"><span class="legend-dot" style="background:var(--node-sigproc)"></span> Signal Processing</button>
      </div>
    </div>

    <div class="mindmap-container" id="mindmap-container">
      <span class="mindmap-hint">Drag nodes · scroll to zoom · click to read</span>
    </div>
  </div>

  <!-- ====== Note overlay ====== -->
  <div class="note-overlay" id="note-overlay">
    <div class="note-overlay__card" id="note-card">
      <button class="note-overlay__close" id="note-close" aria-label="Close note">&times;</button>
      <span class="note-overlay__category" id="note-category"></span>
      <h2 class="note-overlay__title" id="note-title"></h2>
      <div class="note-overlay__body" id="note-body"></div>
      <div class="note-overlay__connected" id="note-connected">
        <p class="note-overlay__connected-label">Connected notes</p>
        <div class="note-overlay__connected-links" id="note-connected-links"></div>
      </div>
    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/nav.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
  <script src="js/mindmap.js?v=3"></script>
</body>
</html>
