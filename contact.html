<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Random Thoughts of a Random Guy</title>
  <meta name="description"
    content="Get in touch with Random Thoughts of a Random Guy — reach out about collaboration, questions, or just to say hi.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ====== Navigation ====== -->
  <nav class="nav" id="main-nav"></nav>

  <!-- ====== Main content ====== -->
  <main class="page-content">
    <div class="container" style="max-width:800px">
      <div class="contact-layout fade-in">

        <!-- Left column — info -->
        <div class="contact-info">
          <h1 class="contact-info__title">Let's connect</h1>

          <div class="contact-info__status">
            <span class="status-dot"></span>
            Available for freelance &amp; consulting
          </div>

          <div class="contact-socials">
            <a href="mailto:px94@pm.me" class="contact-social-link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
              px94@pm.me
            </a>
          </div>
        </div>

        <!-- Right column — form -->
        <div>
          <!--
            ============================================================
            FORMSPREE INTEGRATION
            Replace YOUR_FORM_ID below with your Formspree form ID.
            1. Sign up free at https://formspree.io
            2. Create a new form → copy the form ID (e.g. "xpznqkdl")
            3. Paste it below in place of YOUR_FORM_ID
            ============================================================
          -->
          <form class="contact-form" id="contact-form" action="https://formspree.io/f/xyzdgbgj" method="POST">

            <div class="form-group">
              <label class="form-label" for="contact-name">Name</label>
              <input class="form-input" type="text" id="contact-name" name="name" placeholder="Your name" required>
              <span class="form-error" id="error-name">Please enter your name.</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="contact-email">Email</label>
              <input class="form-input" type="email" id="contact-email" name="email" placeholder="you@example.com"
                required>
              <span class="form-error" id="error-email">Please enter a valid email.</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="contact-message">Message</label>
              <textarea class="form-textarea" id="contact-message" name="message" placeholder="What's on your mind?"
                rows="6" required></textarea>
              <span class="form-error" id="error-message">Please enter a message.</span>
            </div>

            <button type="submit" class="form-submit" id="contact-submit">Send message</button>

            <div class="form-success" id="form-success">
              ✓ Message sent! I'll get back to you soon.
            </div>
          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="footer">
    <p class="footer__text">&copy; 2026 Random Thoughts of a Random Guy. Built with care.</p>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
