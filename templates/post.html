<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Random Thoughts of a Random Guy</title>
  <meta name="description" content="{{EXCERPT}}">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="nav" id="main-nav"></nav>

  <main class="post-detail">
    <div class="container">
      <a href="../posts.html" class="post-detail__back">← Back to posts</a>
      <p class="post-detail__meta">{{DATE}} · {{READ_TIME}}</p>
      <h1 class="post-detail__title">{{TITLE}}</h1>
      <div class="post-detail__tags">
        {{TAGS}}
      </div>

      <article class="post-detail__body">
{{CONTENT}}
      </article>
    </div>
  </main>

  <footer class="footer">
    <p class="footer__text">&copy; 2026 Random Thoughts of a Random Guy. Built with care.</p>
  </footer>
  <script src="../js/nav.js?v=3"></script>
  <script src="../js/main.js?v=3"></script>
</body>
</html>
